
name: Deploy React EHR to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Compile Solidity contracts
        run: npx truffle compile

      - name: Verify contract artifacts
        run: |
          ls -la src/build/contracts
          test -f src/build/contracts/DiagnosticRegistration.json
          test -f src/build/contracts/DoctorRegistration.json
          test -f src/build/contracts/PatientRegistration.json
          test -f src/build/contracts/UploadEhr.json

      - name: Build React application
        run: npm run build
        env:
          PUBLIC_URL: /EHR

      - name: Upload build files
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
